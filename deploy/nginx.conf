# /etc/nginx/sites-available/taymaz
# پروکسی معکوس جلوی Next.js (next start روی 127.0.0.1:3000)

upstream taymaz_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name taymazglobal.com www.taymazglobal.com;

    # بعد از گرفتن گواهی SSL (certbot) این بلوک به 443 ریدایرکت می‌شود
    client_max_body_size 25m;

    # فایل‌های استاتیک Next.js با کش طولانی
    location /_next/static/ {
        proxy_pass http://taymaz_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://taymaz_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
